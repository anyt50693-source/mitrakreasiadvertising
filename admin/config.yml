backend:
  name: github
  repo: anyt50693-source/mitrakreasiadvertising
  branch: master
  base_url: https://mitrakreasiindonesia.vercel.app
  auth_endpoint: /api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "services"
    label: "Layanan"
    folder: "_data/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Deskripsi", name: "description", widget: "text" }
      - { label: "Ikon", name: "icon", widget: "string", hint: "Nama file gambar" }
      - { label: "Urutan", name: "order", widget: "number" }

  - name: "portfolio"
    label: "Portofolio"
    folder: "_data/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Gambar", name: "image", widget: "image", media_folder: "/images/portfolio" }
      - { label: "Kategori", name: "category", widget: "string" }
      - { label: "Deskripsi", name: "description", widget: "text" }
      - { label: "Urutan", name: "order", widget: "number" }

  - name: "blog"
    label: "Artikel"
    folder: "_data/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Kategori", name: "category", widget: "select", options: ["Tips", "Material", "Tren", "Proyek", "Berita"] }
      - { label: "Gambar", name: "image", widget: "image", media_folder: "/images/blog" }
      - { label: "Deskripsi Singkat", name: "excerpt", widget: "text" }
      - { label: "Konten", name: "body", widget: "markdown" }

  - name: "testimonials"
    label: "Testimoni"
    folder: "_data/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nama", name: "name", widget: "string" }
      - { label: "Jabatan", name: "role", widget: "string" }
      - { label: "Perusahaan", name: "company", widget: "string" }
      - { label: "Testimoni", name: "quote", widget: "text" }
      - { label: "Rating", name: "rating", widget: "number", default: 5, min: 1, max: 5 }

  - name: "hero"
    label: "Hero Slideshow"
    folder: "_data/hero"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Gambar", name: "image", widget: "image", media_folder: "/images" }
      - { label: "Teks Alt", name: "alt", widget: "string" }
      - { label: "Aktif", name: "active", widget: "boolean", default: false }