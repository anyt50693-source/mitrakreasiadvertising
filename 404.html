<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | Mitra Kreasi Indonesia</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8FAFC;
            text-align: center;
            padding: 24px;
        }
        .error-content { max-width: 500px; }
        .error-code {
            font-size: clamp(100px, 20vw, 200px);
            font-weight: 900;
            color: #F97316;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-title {
            font-size: 28px;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 16px;
        }
        .error-desc {
            font-size: 16px;
            color: #64748B;
            margin-bottom: 32px;
            line-height: 1.7;
        }
        .error-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: #F97316;
            color: #FFFFFF;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .error-home:hover {
            background: #EA580C;
            transform: translateY(-2px);
        }
        .error-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: transparent;
            color: #64748B;
            border: 2px solid rgba(0,0,0,0.12);
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .error-back:hover {
            border-color: #F97316;
            color: #F97316;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Halaman Tidak Ditemukan</h1>
            <p class="error-desc">Sepertinya halaman yang Anda cari sudah dipindahkan, dihapus, atau tidak pernah ada. Mari kita kembali ke beranda.</p>
            <div class="error-buttons">
                <a href="index.html" class="error-home">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Kembali ke Beranda
                </a>
                <a href="javascript:history.back()" class="error-back">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Halaman Sebelumnya
                </a>
            </div>
        </div>
    </div>
</body>
</html>
